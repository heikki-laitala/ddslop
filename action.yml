name: ddslop
description: Find the duplicated and dead code AI coding agents leave behind, and annotate pull requests with refactoring candidates.
author: Heikki Laitala
branding:
  icon: scissors
  color: purple

inputs:
  version:
    description: ddslop release to install, such as v1.0.0. Defaults to the tag this action is pinned to (v1 means the release it points to), else the latest release.
    default: ""
  path:
    description: Repository to analyse.
    default: "."
  diff:
    description: Report only candidates touching lines changed since this Git ref, such as origin/main. Needs actions/checkout with fetch-depth 0.
    default: ""
  baseline:
    description: Baseline file of known duplication to leave out (see ddslop baseline).
    default: ""
  fail-over:
    description: Fail only when the repository's duplication percentage is above this, instead of on any candidate.
    default: ""
  args:
    description: Further arguments for ddslop check, separated by spaces.
    default: ""
  upload-sarif:
    description: Upload the results to GitHub code scanning (needs the security-events write permission). Pull requests from forks and Dependabot, whose token cannot upload, get workflow annotations instead, as when this is "false".
    default: "true"

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.check.outputs.sarif-file }}
  exit-code:
    description: ddslop's exit code (0 nothing to report, 1 candidates or over the limit, 2 error).
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install ddslop
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        INSTALLER: ${{ github.action_path }}/install.sh
      run: |
        version="${VERSION:-${ACTION_REF}}"
        case "$version" in
          v[0-9]*.*.*) ;;
          v[0-9]*)
            # A major tag such as v1 moves with each release: install the
            # vX.Y.Z release at the same commit (peeled for annotated tags).
            major="$version"
            version=$(git ls-remote --tags https://github.com/heikki-laitala/ddslop "$major" "$major.*" | awk -v major="$major" '
              { name = $2; sub("refs/tags/", "", name)
                if (sub(/\^\{\}$/, "", name)) { sha[name] = $1; peeled[name] = 1 }
                else if (!peeled[name]) sha[name] = $1 }
              END { for (n in sha) if (n != major && n ~ "^" major "\\.[0-9]+\\.[0-9]+$" && sha[n] == sha[major]) print n }' |
              sort -V | tail -n 1)
            if [ -z "$version" ]; then echo "::error::no ddslop release matches $major"; exit 2; fi
            ;;
          *) version=latest ;;
        esac
        bash "$INSTALLER" --no-interactive --version "$version" --dir "$RUNNER_TEMP/ddslop-bin"

    - name: Check
      id: check
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        DIFF: ${{ inputs.diff }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_OVER: ${{ inputs.fail-over }}
        ARGS: ${{ inputs.args }}
      run: |
        sarif="$RUNNER_TEMP/ddslop.sarif"
        args=(check --format sarif)
        if [ -n "$DIFF" ]; then args+=(--diff "$DIFF"); fi
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        if [ -n "$FAIL_OVER" ]; then args+=(--fail-over "$FAIL_OVER"); fi
        read -ra extra <<<"$ARGS"
        set +e
        "$RUNNER_TEMP/ddslop-bin/ddslop" "${args[@]}" "${extra[@]}" "$TARGET" >"$sarif"
        code=$?
        set -e
        echo "sarif-file=$sarif" >>"$GITHUB_OUTPUT"
        echo "exit-code=$code" >>"$GITHUB_OUTPUT"

    - name: Choose where results go
      id: report
      shell: bash
      env:
        UPLOAD: ${{ inputs.upload-sarif }}
        FORK: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
        DEPENDABOT: ${{ github.event.pull_request && github.actor == 'dependabot[bot]' }}
      run: |
        # Pull requests from forks and Dependabot get a read-only token:
        # uploading would fail.
        if [ "$UPLOAD" = true ] && { [ "$FORK" = true ] || [ "$DEPENDABOT" = true ]; }; then
          echo "::notice::ddslop: this pull request's token cannot upload to code scanning; results are shown as annotations"
          UPLOAD=false
        fi
        echo "upload=$UPLOAD" >>"$GITHUB_OUTPUT"

    - name: Upload to code scanning
      if: always() && steps.report.outputs.upload == 'true' && steps.check.outputs.exit-code != '2'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.check.outputs.sarif-file }}
        category: ddslop

    - name: Annotate
      if: always() && steps.report.outputs.upload != 'true' && steps.check.outputs.exit-code != '2'
      shell: bash
      env:
        SARIF: ${{ steps.check.outputs.sarif-file }}
        TARGET: ${{ inputs.path }}
        CODE: ${{ steps.check.outputs.exit-code }}
      run: |
        # SARIF paths are relative to the analysed path; annotations take
        # paths relative to the repository. Below fail-over the check
        # passes but still reports its candidates: warnings, not errors.
        # Plain shell: macOS has no realpath --relative-to.
        abs=$(cd "$TARGET" && pwd -P)
        ws=$(cd "$GITHUB_WORKSPACE" && pwd -P)
        case "$abs" in
          "$ws") prefix=. ;;
          "$ws"/*) prefix=${abs#"$ws"/} ;;
          *) prefix=$abs ;; # outside the repository: annotations cannot attach
        esac
        level=error
        if [ "$CODE" = 0 ]; then level=warning; fi
        jq -r --arg prefix "$prefix" --arg level "$level" '
          def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
          def prop: data | gsub(":"; "%3A") | gsub(","; "%2C");
          .runs[].results[] | .locations[0].physicalLocation as $l |
          "::\($level) file=\(($prefix + "/" + $l.artifactLocation.uri) | ltrimstr("./") | prop),line=\($l.region.startLine),endLine=\($l.region.endLine // $l.region.startLine),title=ddslop \(.ruleId | prop)::\(.message.text | data)"
        ' "$SARIF"

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: |
        case "$CODE" in
          0) echo "ddslop: passed" ;;
          1) echo "::error::ddslop found duplication to refactor (see the annotations on the changed files)"; exit 1 ;;
          *) echo "::error::ddslop failed (exit code $CODE)"; exit 2 ;;
        esac
