name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.binary }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # tree-sitter and SQLite are C, so every target is built with cgo
          # and that platform's C compiler.
          - binary: ddslop-linux-x86_64
            os: ubuntu-latest
            goarch: amd64
            cc: gcc
            native: true
          - binary: ddslop-linux-aarch64
            os: ubuntu-latest
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            native: false
          - binary: ddslop-macos-aarch64
            os: macos-latest
            goarch: arm64
            cc: clang
            native: true
          - binary: ddslop-macos-x86_64
            os: macos-latest
            goarch: amd64
            cc: clang -arch x86_64
            native: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross-compiler (Linux aarch64)
        if: matrix.goarch == 'arm64' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/heikki-laitala/ddslop/internal/cli.version=${GITHUB_REF_NAME}" \
            -o ddslop .

      - name: Smoke test
        if: matrix.native
        run: scripts/smoke-test.sh ./ddslop

      - name: Package
        run: |
          scripts/notices.sh > THIRD_PARTY_NOTICES.md
          mkdir "${{ matrix.binary }}"
          cp ddslop LICENSE THIRD_PARTY_NOTICES.md README.md "${{ matrix.binary }}/"
          tar -czf "${{ matrix.binary }}.tar.gz" "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}.tar.gz

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
