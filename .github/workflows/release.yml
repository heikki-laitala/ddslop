name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-26.04
    steps:
      - name: Only vMAJOR.MINOR.PATCH is a release
        # The trigger is a glob, which also matches v1.2.3-rc.1.
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not a vMAJOR.MINOR.PATCH tag" >&2; exit 1; }

  build:
    name: Build (${{ matrix.binary }})
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # tree-sitter and SQLite are C, so every target is built with cgo
          # and that platform's C compiler.
          - binary: ddslop-linux-x86_64
            os: ubuntu-26.04
            goarch: amd64
            cc: gcc
            native: true
          - binary: ddslop-linux-aarch64
            os: ubuntu-26.04
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            native: false
          - binary: ddslop-macos-aarch64
            os: macos-latest
            goarch: arm64
            cc: clang
            native: true
          - binary: ddslop-macos-x86_64
            os: macos-latest
            goarch: amd64
            cc: clang -arch x86_64
            native: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cross-compiler (Linux aarch64)
        if: matrix.goarch == 'arm64' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/heikki-laitala/ddslop/internal/cli.version=${GITHUB_REF_NAME}" \
            -o ddslop .

      - name: Smoke test
        if: matrix.native
        run: scripts/smoke-test.sh ./ddslop

      - name: Package
        run: |
          scripts/notices.sh > THIRD_PARTY_NOTICES.md
          mkdir "${{ matrix.binary }}"
          cp ddslop LICENSE THIRD_PARTY_NOTICES.md README.md "${{ matrix.binary }}/"
          tar -czf "${{ matrix.binary }}.tar.gz" "${{ matrix.binary }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}.tar.gz

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt

  verify:
    name: Verify release
    needs: release
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}

  action:
    name: Verify the action
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action at this tag, before the major tag moves to it.
      - uses: ./
        with:
          version: ${{ github.ref_name }}
          upload-sarif: "false"
      - name: The action installed this release
        run: |
          got="$("$RUNNER_TEMP/ddslop-bin/ddslop" version)"
          test "$got" = "ddslop $GITHUB_REF_NAME" || { echo "installed '$got', want 'ddslop $GITHUB_REF_NAME'" >&2; exit 1; }

  major-tag:
    name: Move the major tag
    needs: action
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point vMAJOR at this release
        # Workflows only trigger on vX.Y.Z tags, and pushes made with
        # GITHUB_TOKEN trigger none, so this starts no release.
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  action-major:
    name: Verify the action at the major tag
    needs: major-tag
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Update the major here when releasing v2.
      - uses: heikki-laitala/ddslop@v1
        with:
          upload-sarif: "false"
      - name: The action installed this release
        run: |
          got="$("$RUNNER_TEMP/ddslop-bin/ddslop" version)"
          test "$got" = "ddslop $GITHUB_REF_NAME" || { echo "installed '$got', want 'ddslop $GITHUB_REF_NAME'" >&2; exit 1; }
