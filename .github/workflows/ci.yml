name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
      - name: Markdown lint
        run: make lint-md

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with race detector and coverage gate
        run: make cover
      - name: Build
        run: make build
      # Test code included: a copy in the tests fails the build too. Stricter
      # than the default: functions down to 30 syntax nodes, not 50, and
      # copied blocks down to 80, not 100.
      - name: ddslop on its own code
        run: bin/ddslop check --format text --tests --min-nodes 30 --min-block-nodes 80 .
      - name: Smoke test
        run: scripts/smoke-test.sh bin/ddslop

  rustc-oracle:
    # Rust too-public against the compiler: generated crates, checked with
    # rustc's unreachable_pub lint (see TestTooPublicAgreesWithRustcOnReachability).
    name: Rust too-public against rustc
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compare with rustc
        run: cargo --version && make oracle ORACLE_CASES=300

  latest-release:
    name: Latest release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The latest published ddslop on this code, with no baseline: a
      # candidate it finds fails the job until it is fixed or marked
      # ddslop:ignore with a reason, and annotates the pull request as it
      # does for users: the action's defaults, as users run it.
      - uses: ./
        with:
          version: latest

  action:
    name: Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sample project with a renamed copy
        run: |
          mkdir -p "$RUNNER_TEMP/sample/src"
          for name in users orders; do
            cat > "$RUNNER_TEMP/sample/src/$name.rs" <<RUST
          pub fn load_${name}(db: &Db, id: u64) -> Result<Row, Error> {
              let row = db.query("SELECT * FROM ${name} WHERE id = \$1", &[&id])?;
              let name: String = row.get(0);
              let email: String = row.get(1);
              if name.is_empty() {
                  return Err(Error::NotFound(id));
              }
              Ok(Row { name, email })
          }
          RUST
          done
      # The runs that find the copy report it without failing (fail and
      # annotate "false"): a failed step, even one allowed to fail, puts an
      # error on every pull request's checks.
      - name: Run the action
        id: ddslop
        uses: ./
        with:
          path: ${{ runner.temp }}/sample
          args: --min-nodes 20
          upload-sarif: "false"
          annotate: "false"
          fail: "false"
      - name: The action found the copy
        env:
          OUTCOME: ${{ steps.ddslop.outcome }}
          CODE: ${{ steps.ddslop.outputs.exit-code }}
          SARIF: ${{ steps.ddslop.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = success || { echo "outcome $OUTCOME, want success with fail false" >&2; exit 1; }
          test "$CODE" = 1 || { echo "exit code $CODE, want 1" >&2; exit 1; }
          grep -q '"ruleId": "renamed-clone"' "$SARIF" || { echo "the SARIF report has no renamed-clone result" >&2; cat "$SARIF"; exit 1; }
      # Diff mode, as pull requests use it: the copy is reported when the
      # change adds it, not when it was there before.
      - name: Sample history, the copy added by the last commit
        working-directory: ${{ runner.temp }}/sample
        run: |
          git init -q
          git add src/users.rs
          git -c user.name=ci -c user.email=ci@example.com commit -qm users
          git add src/orders.rs
          git -c user.name=ci -c user.email=ci@example.com commit -qm orders
      - name: Run the action on the change adding the copy
        id: added
        uses: ./
        with:
          path: ${{ runner.temp }}/sample
          diff: HEAD~1
          args: --min-nodes 20
          upload-sarif: "false"
          annotate: "false"
          fail: "false"
      - name: Run the action on no change
        id: unchanged
        uses: ./
        with:
          path: ${{ runner.temp }}/sample
          diff: HEAD
          args: --min-nodes 20
          upload-sarif: "false"
          annotate: "false"
      # Below fail-over the check passes, its candidates annotated as
      # warnings: the one run that annotates, so the annotation code runs.
      # The others leave annotations out, which would read as findings of
      # this pull request. No run fails on purpose, so the exit 1 that
      # fails a job on candidates is the one path no run takes.
      - name: Run the action under a duplication limit
        id: limit
        uses: ./
        with:
          path: ${{ runner.temp }}/sample
          fail-over: "100"
          args: --min-nodes 20
          upload-sarif: "false"
      - name: Diff mode reported only the added copy, and the limit passed
        env:
          ADDED: ${{ steps.added.outputs.exit-code }}
          UNCHANGED: ${{ steps.unchanged.outputs.exit-code }}
          LIMIT: ${{ steps.limit.outputs.exit-code }}
        run: |
          test "$ADDED" = 1 || { echo "exit code $ADDED for the change adding the copy, want 1" >&2; exit 1; }
          test "$UNCHANGED" = 0 || { echo "exit code $UNCHANGED for no change, want 0" >&2; exit 1; }
          test "$LIMIT" = 0 || { echo "exit code $LIMIT under the duplication limit, want 0" >&2; exit 1; }
