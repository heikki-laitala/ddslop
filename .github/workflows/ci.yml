name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
      - name: Markdown lint
        run: make lint-md

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with race detector and coverage gate
        run: make cover
      - name: Build
        run: make build
      - name: ddslop on its own code
        run: bin/ddslop check --format text .
      - name: Smoke test
        run: scripts/smoke-test.sh bin/ddslop

  latest-release:
    name: Latest release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The latest published ddslop on this code, with no baseline: a
      # candidate it finds fails the job until it is fixed or marked
      # ddslop:ignore with a reason, and annotates the pull request as it
      # does for users. A fork's token cannot upload, so its pull requests
      # only fail the job.
      - uses: ./
        with:
          version: latest
          upload-sarif: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  action:
    name: Action
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sample project with a renamed copy
        run: |
          mkdir -p "$RUNNER_TEMP/sample/src"
          for name in users orders; do
            cat > "$RUNNER_TEMP/sample/src/$name.rs" <<RUST
          pub fn load_${name}(db: &Db, id: u64) -> Result<Row, Error> {
              let row = db.query("SELECT * FROM ${name} WHERE id = \$1", &[&id])?;
              let name: String = row.get(0);
              let email: String = row.get(1);
              if name.is_empty() {
                  return Err(Error::NotFound(id));
              }
              Ok(Row { name, email })
          }
          RUST
          done
      - name: Run the action
        id: ddslop
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/sample
          args: --min-nodes 20
          upload-sarif: "false"
      - name: The action found the copy and failed
        env:
          OUTCOME: ${{ steps.ddslop.outcome }}
          CODE: ${{ steps.ddslop.outputs.exit-code }}
          SARIF: ${{ steps.ddslop.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = failure || { echo "outcome $OUTCOME, want failure" >&2; exit 1; }
          test "$CODE" = 1 || { echo "exit code $CODE, want 1" >&2; exit 1; }
          grep -q '"ruleId": "renamed-clone"' "$SARIF" || { echo "the SARIF report has no renamed-clone result" >&2; cat "$SARIF"; exit 1; }
